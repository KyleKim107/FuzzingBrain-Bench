# From the source bug_report ASan/libFuzzer output (harness replay AND Path-B
# standalone repro, both deterministic 1/1):
#   gen/third_party/libc++/src/include/__vector/vector.h:412:
#     libc++ Hardening assertion __n < size() failed: vector[] index out of bounds
#   ==...==ERROR: libFuzzer: deadly signal
# The OOB index site that drives __n=0,size()=0 is
#   printing::ParsePpdCapabilities  printing/backend/cups_helper.cc:950 (caps.papers[0]).
#
# NB: the observable sanitizer signature is a libc++ hardened-mode abort
# (deadly signal), not a classic ASan "heap-buffer-overflow" redzone report,
# because std::vector::operator[] traps the empty access before the read lands.
# Build NOT validated standalone (chromium-internal) — see NOTES.md.

reach:
  expected_file: cups_helper.cc
  expected_function: ParsePpdCapabilities
  expected_line_range: [900, 952]

class:
